<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Enchantment 的个人主页</title>
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css" />
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/index.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgb(var(--mdui-color-surface));
            color: rgb(var(--mdui-color-on-surface));
            transition: background 0.3s, color 0.3s;
        }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(var(--mdui-color-surface));
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .page-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .page-container.loaded {
            opacity: 1;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0.25rem 0 1.5rem;
            gap: 0.5rem;
            position: relative;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
        }
        mdui-avatar {
            --size: 80px;
            font-size: 40px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }
        mdui-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        mdui-card {
            display: block;
            margin-bottom: 1.8rem;
            transition: box-shadow 0.3s, transform 0.25s;
            position: relative;
        }
        mdui-card:hover {
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            transform: translateY(-3px);
        }
        .card-content {
            padding: 1.8rem;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
            color: rgb(var(--mdui-color-on-surface));
        }
        .card-header h2 {
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0;
        }
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 0.4rem;
        }
        .link-row {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 0.8rem;
        }
        .footer-note {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.875rem;
            color: rgb(var(--mdui-color-on-surface-variant));
            border-top: 1px solid rgb(var(--mdui-color-outline-variant));
            padding-top: 2rem;
            opacity: 0.7;
        }
        .card p,
        .footer-note span,
        .subhead span,
        h1 {
            color: transparent !important;
            user-select: none;
        }
        .footer-note span::before {
            content: '© 2026 Enchantment. 保留所有权利';
            color: rgb(var(--mdui-color-on-surface-variant));
            opacity: 0.4;
        }
        h1::before {
            content: 'Enchantment-Niko';
            color: rgb(var(--mdui-color-on-surface));
            opacity: 0.25;
            font-size: 2.25rem;
            font-weight: 400;
        }
        .subhead span::before {
            content: '又名 Enchantment';
            color: rgb(var(--mdui-color-on-surface-variant));
            opacity: 0.4;
        }
        #themeTriggerBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: rgb(var(--mdui-color-on-surface-variant));
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            padding: 0;
            position: relative;
            overflow: hidden;
        }
        #themeTriggerBtn:hover {
            background: rgba(var(--mdui-color-on-surface), 0.08);
        }
        #themeTriggerBtn:active {
            transform: scale(0.92);
        }
        #themeTriggerBtn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            display: block;
            position: relative;
            z-index: 1;
        }
        mdui-menu {
            min-width: 140px !important;
        }
        .dialog-content {
            padding: 24px;
            text-align: center;
            font-size: 1.1rem;
            color: rgb(var(--mdui-color-on-surface));
        }
        .dialog-content .email {
            font-weight: 600;
            color: rgb(var(--mdui-color-primary));
            font-size: 1.2rem;
            margin-top: 8px;
            display: block;
        }
        .dialog-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgb(var(--mdui-color-outline-variant));
        }
        mdui-divider {
            margin: 1.2rem 0;
            display: block;
        }
        mdui-chip {
            cursor: default;
        }
        @media (max-width: 480px) {
            .page-container {
                padding: 1.5rem 1.2rem 3rem;
            }
            mdui-avatar {
                --size: 68px;
                font-size: 32px;
            }
            .card-content {
                padding: 1.4rem;
            }
            .dialog-actions {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <mdui-linear-progress></mdui-linear-progress>
    <div id="loadingOverlay">
        <mdui-circular-progress></mdui-circular-progress>
    </div>
    <div class="page-container" id="mainContent">
        <div class="top-bar">
            <mdui-dropdown>
                <mdui-button slot="trigger" variant="text" id="themeTriggerBtn" style="min-width:44px;padding:0;">
                    <span id="themeIconContainer">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 9c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                        </svg>
                    </span>
                    <mdui-tooltip content="主题"></mdui-tooltip>
                </mdui-button>
                <mdui-menu selects="single" value="auto">
                    <mdui-menu-item id="themeLightItem" value="light">亮色模式</mdui-menu-item>
                    <mdui-menu-item id="themeDarkItem" value="dark">暗色模式</mdui-menu-item>
                    <mdui-menu-item id="themeAutoItem" value="auto" selected>跟随系统</mdui-menu-item>
                </mdui-menu>
            </mdui-dropdown>
            <mdui-icon-button icon="menu"></mdui-icon-button>
        </div>
        <div class="hero">
            <mdui-avatar src="https://avatars.githubusercontent.com/u/312004201?v=4"></mdui-avatar>
            <h1></h1>
            <div class="subhead">
                <span></span>
            </div>
        </div>
        <mdui-card>
            <div class="card-content">
                <div class="card-header">
                    <h2>开门见山</h2>
                </div>
                <p>游玩 Eaglercraft 高版本(1.12.2+, 带汉化版)</p>
                <div class="link-row">
                    <mdui-button variant="outlined" href="https://mcjs.link/#beta" target="_blank">MCJS镜像</mdui-button>
                    <mdui-button variant="outlined" href="https://enchantment-niko.github.io/webmc/" target="_blank">Github Pages 源站</mdui-button>
                </div>
            </div>
        </mdui-card>
        <mdui-card>
            <div class="card-content">
                <div class="card-header">
                    <h2>玩过的游戏</h2>
                </div>
                <p></p>
                <p></p>
                <div class="chip-group">
                    <mdui-chip variant="minecraft">Minecraft</mdui-chip>
                    <mdui-chip variant="oneshot">OneShot</mdui-chip>
                    <mdui-chip variant="terraria">Terraria</mdui-chip>
                    <mdui-chip variant="eaglercraft">Eaglercraft</mdui-chip>
                </div>
            </div>
        </mdui-card>
        <mdui-card>
            <div class="card-content">
                <div class="card-header">
                    <h2>Email</h2>
                </div>
                <p>不要滥发邮件哦</p>
                <div class="link-row">
                    <mdui-button variant="filled" id="emailDialogBtn">
                        打开邮箱
                    </mdui-button>
                </div>
            </div>
        </mdui-card>
        <mdui-card>
            <div class="card-content">
                <div class="card-header">
                    <h2>一些网站</h2>
                </div>
                <p>Discord 同名</p>
                <div class="link-row">
                    <mdui-button variant="outlined" href="https://space.bilibili.com/3546899699207112" target="_blank">B站</mdui-button>
                    <mdui-button variant="outlined" href="https://www.youtube.com/@Enchantment-Niko" target="_blank">YouTube</mdui-button>
                </div>
            </div>
        </mdui-card>
        <div class="footer-note">
            <span></span>
            <div style="margin-top:12px;">
                <mdui-button variant="outlined" href="https://www.mdui.org/zh-cn/" target="_blank">使用开源项目 MDUI2</mdui-button>
            </div>
        </div>
    </div>
    <mdui-dialog id="emailDialog" close-on-esc close-on-overlay-click>
        <div class="dialog-content">
            <div>电子邮件地址</div>
            <span class="email">eaglerwool@outlook.com</span>
            <div class="dialog-actions">
                <mdui-button variant="text" id="closeDialogBtn">关闭</mdui-button>
                <mdui-button variant="filled" id="mailtoBtn">
                    发送邮件
                </mdui-button>
            </div>
        </div>
    </mdui-dialog>
    <script>
        const { snackbar } = mdui;
        const lightItem = document.getElementById('themeLightItem');
        const darkItem = document.getElementById('themeDarkItem');
        const autoItem = document.getElementById('themeAutoItem');
        const iconContainer = document.getElementById('themeIconContainer');
        const html = document.documentElement;
        const mainContent = document.getElementById('mainContent');
        const loadingOverlay = document.getElementById('loadingOverlay');

        const lightSvg = `<svg viewBox="0 0 24 24"><path d="M12 9c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>`;
        const darkSvg = `<svg viewBox="0 0 24 24"><path d="M9.37 5.51A7.35 7.35 0 0 0 9.1 7.5c0 4.08 3.32 7.4 7.4 7.4.68 0 1.35-.09 1.99-.27A7.014 7.014 0 0 1 12 19c-3.86 0-7-3.14-7-7 0-2.93 1.81-5.45 4.37-6.49zM12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>`;
        const autoSvg = `<svg viewBox="0 0 24 24"><path d="M4 6h16v10H4V6zm0 12h10v2H4v-2zm16-2v2h-4v-2h4zM2 4v14h18V4H2z"/></svg>`;

        function updateTriggerIcon(mode) {
            let svg = lightSvg;
            if (mode === 'dark') svg = darkSvg;
            else if (mode === 'auto') svg = autoSvg;
            iconContainer.innerHTML = svg;
        }

        function setTheme(mode) {
            html.classList.remove('mdui-theme-light', 'mdui-theme-dark');
            if (mode === 'dark') {
                html.classList.add('mdui-theme-dark');
            } else if (mode === 'light') {
                html.classList.add('mdui-theme-light');
            } else if (mode === 'auto') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.classList.add(prefersDark ? 'mdui-theme-dark' : 'mdui-theme-light');
            }
            updateTriggerIcon(mode);
            const msg = mode === 'light' ? '亮色模式' : mode === 'dark' ? '暗色模式' : '跟随系统';
            snackbar({ message: `已切换至 ${msg}` });
        }

        lightItem.addEventListener('click', () => setTheme('light'));
        darkItem.addEventListener('click', () => setTheme('dark'));
        autoItem.addEventListener('click', () => setTheme('auto'));

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark ? 'dark' : 'light');

        const dialog = document.querySelector('#emailDialog');
        const openButton = document.querySelector('#emailDialogBtn');
        const closeButton = document.querySelector('#closeDialogBtn');
        const mailtoButton = document.querySelector('#mailtoBtn');
        openButton.addEventListener('click', () => dialog.open = true);
        closeButton.addEventListener('click', () => dialog.open = false);
        mailtoButton.addEventListener('click', () => {
            const email = 'eaglerwool@outlook.com';
            window.location.href = `mailto:${email}`;
            dialog.open = false;
        });

        function addRipple(element) {
            element.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const ripple = document.createElement('span');
                const size = Math.max(rect.width, rect.height);
                ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        left: ${x - size/2}px;
                        top: ${y - size/2}px;
                        border-radius: 50%;
                        background: rgba(var(--mdui-color-primary), 0.25);
                        transform: scale(0);
                        animation: rippleAnim 0.6s ease-out;
                        pointer-events: none;
                        z-index: 100;
                    `;
                if (getComputedStyle(this).position === 'static') {
                    this.style.position = 'relative';
                }
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });
        }

        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
                @keyframes rippleAnim {
                    to {
                        transform: scale(2.5);
                        opacity: 0;
                    }
                }
            `;
        document.head.appendChild(styleSheet);

        document.querySelectorAll('#emailDialogBtn, #mailtoBtn, #closeDialogBtn').forEach(el => {
            addRipple(el);
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                mainContent.classList.add('loaded');
            }, 400);
        });

        setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden')) {
                loadingOverlay.classList.add('hidden');
                mainContent.classList.add('loaded');
            }
        }, 5000);
    </script>
</body>
</html>
